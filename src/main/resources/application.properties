# Optional local sentiment model/lexicon file for feedback analysis.
# Supported formats: JSON ({ "tokenScores": { "good": 1.2, "bad": -1.3 } }) or CSV (token,score).
app.sentiment.model.path=
spring.config.import=optional:file:./application-local.properties
spring.application.name=SmartClinic
app.clinic-zone=${APP_CLINIC_ZONE:Asia/Colombo}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost;databaseName=SmartClinic;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ChangeMe123!}
server.port=8088
app.base-url=${APP_BASE_URL:http://localhost:8088}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Chatbot (Python service)
app.chatbot.url=${APP_CHATBOT_URL:http://127.0.0.1:8002/chat}
app.face-api.url=${APP_FACE_API_URL:http://127.0.0.1:8000/extract}
app.ocr-api.url=${APP_OCR_API_URL:http://127.0.0.1:8001/ocr}
app.symptoms.options-url=${APP_SYMPTOMS_OPTIONS_URL:http://127.0.0.1:8002/symptoms/options}
app.symptoms.analyze-url=${APP_SYMPTOMS_ANALYZE_URL:http://127.0.0.1:8002/symptoms/analyze}
app.sentiment.api.url=${APP_SENTIMENT_API_URL:http://127.0.0.1:8002/sentiment/analyze}
# Update to your clinic front desk WhatsApp number (digits only recommended, e.g. 94771234567)
app.support.whatsapp=${APP_SUPPORT_WHATSAPP:94712469215}
# Clinic front desk contact number
app.support.phone=${APP_SUPPORT_PHONE:0332233027}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# PayPal Configuration (Sandbox)
paypal.client-id=${PAYPAL_CLIENT_ID:your_paypal_client_id}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:your_paypal_client_secret}
paypal.api-base-url=${PAYPAL_API_BASE_URL:https://api-m.sandbox.paypal.com}

# FX conversion for LKR display -> USD transaction
forex.usd-rates-url=${FOREX_USD_RATES_URL:https://open.er-api.com/v6/latest/USD}
forex.cache-seconds=${FOREX_CACHE_SECONDS:300}
forex.fallback-lkr-per-usd=${FOREX_FALLBACK_LKR_PER_USD:300.00}

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin Settings
admin.email=${ADMIN_EMAIL:admin@example.com}

# Debugging Email
logging.level.org.springframework.mail=DEBUG
# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.finance.slip-replace-window-minutes=15
app.finance.slip-max-size-bytes=5242880

# OAuth2 (Google) - local dev defaults (override with env vars)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
# Optional fallback; kept for compatibility with explicit registration bean
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
